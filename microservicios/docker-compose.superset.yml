# Servicio principal de Superset (app + init)
# Uso: docker compose -f microservicios/docker-compose.superset.yml up -d
# Requiere: db y redis corriendo

services:
  superset-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: superset_init
    command: ["/bin/sh", "-c", "superset db upgrade && superset fab create-admin --username $${ADMIN_USERNAME} --firstname $${ADMIN_FIRSTNAME:-Admin} --lastname $${ADMIN_LASTNAME:-User} --email $${ADMIN_EMAIL} --password $${ADMIN_PASSWORD} || true && superset init"]
    environment:
      - DATABASE_DIALECT=postgresql
    env_file: ../.env
    volumes:
      - superset_home:/app/superset_home
      - ../superset-config/superset_config.py:/app/pythonpat./superset-config/superset_config.py:ro
    networks:
      - superset_net

  superset:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: superset_app
    restart: always
    environment:
      - DATABASE_DIALECT=postgresql
    env_file: ../.env
    ports:
      - "8088:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes:
      - superset_home:/app/superset_home
      - ../superset-config/superset_config.py:/app/pythonpat./superset-config/superset_config.py:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - superset_net

volumes:
  superset_home:

networks:
  superset_net:
    name: superset_net
    external: true

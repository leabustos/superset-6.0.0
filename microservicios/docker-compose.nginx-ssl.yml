# Nginx con certificados SSL reales para producción
# Uso: docker compose -f microservicios/docker-compose.nginx-ssl.yml up -d
# Requiere: superset corriendo y certificados en ../nginx/certs/

services:
  nginx:
    image: nginx:latest
    container_name: superset_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: ../.env
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d/superset_ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    networks:
      - superset_net

networks:
  superset_net:
    name: superset_net
    external: true

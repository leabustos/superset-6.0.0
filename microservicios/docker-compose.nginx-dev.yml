# Nginx con certificados autofirmados para desarrollo
# Uso: docker compose -f microservicios/docker-compose.nginx-dev.yml up -d
# Requiere: superset corriendo

services:
  nginx-dev:
    image: nginx:latest
    container_name: superset_nginx_dev
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d/superset_dev.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs_dev:/etc/nginx/certs
    networks:
      - superset_net
    entrypoint: /bin/sh
    command: >
      -c "
      if [ ! -f /etc/nginx/certs/selfsigned.crt ]; then
        echo 'Generando certificados autofirmados...';
        apk add --no-cache openssl;
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout /etc/nginx/certs/selfsigned.key \
          -out /etc/nginx/certs/selfsigned.crt \
          -subj '/C=ES/ST=Madrid/L=Madrid/O=Dev/CN=localhost';
      fi &&
      nginx -g 'daemon off;'
      "

volumes:
  nginx_certs_dev:

networks:
  superset_net:
    name: superset_net
    external: true

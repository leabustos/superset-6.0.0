# Servicio de workers de Celery escalable
# Uso: docker compose -f microservicios/docker-compose.worker.yml up -d --scale superset-worker=3
# Requiere: db, redis y superset corriendo

services:
  superset-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    restart: always
    environment:
      - DATABASE_DIALECT=postgresql
    env_file: ../.env
    volumes:
      - superset_home:/app/superset_home
      - ../superset-config/superset_config.py:/app/pythonpat./superset-config/superset_config.py:ro
    healthcheck:
      test: ["CMD-SHELL", "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - superset_net
    deploy:
      replicas: 2

volumes:
  superset_home:
    external: true

networks:
  superset_net:
    name: superset_net
    external: true

# Docker Compose para PostgreSQL standalone
# Uso: docker-compose -f docker/docker-compose-db.yml up -d

services:
  db:
    image: postgres:16
    container_name: superset_db
    restart: always
    env_file:
      - ../.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-superset}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-superset}
      - POSTGRES_DB=${POSTGRES_DB:-superset}
    volumes:
      - superset_db:/var/lib/postgresql/data
      - ../docker/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-superset} -d ${POSTGRES_DB:-superset}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - superset_net

volumes:
  superset_db:

networks:
  superset_net:
    driver: bridge

# Docker Compose para Nginx standalone
# Uso: docker-compose -f docker/docker-compose-nginx.yml up -d
# Requiere: Superset corriendo (ver docker-compose-superset.yml)

services:
  nginx-http:
    image: nginx:latest
    container_name: superset_nginx_http
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d/superset_http.conf:/etc/nginx/conf.d/superset.conf:ro
    networks:
      - superset_net

networks:
  superset_net:
    driver: bridge

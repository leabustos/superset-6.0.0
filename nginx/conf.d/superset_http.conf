# ============================================
# SUPERSET HTTP CONFIGURATION
# ============================================
# Configuración para acceso HTTP (sin SSL)
# Usar solo en desarrollo o detrás de un proxy/VPN

server {
    listen 80;
    server_name _;  # Acepta cualquier nombre de host
    
    # Logs específicos para este servidor
    access_log /var/log/nginx/superset_access.log main;
    error_log /var/log/nginx/superset_error.log warn;
    
    # ============================================
    # SECURITY HEADERS
    # ============================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # ============================================
    # HEALTH CHECK ENDPOINT
    # ============================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # ============================================
    # STATIC FILES
    # ============================================
    # Cachear archivos estáticos
    location /static/ {
        proxy_pass http://superset;
        proxy_cache_valid 200 1d;
        proxy_cache_bypass $http_pragma $http_authorization;
        add_header Cache-Control "public, max-age=86400";
        expires 1d;
    }
    
    # ============================================
    # WEBSOCKET SUPPORT
    # ============================================
    # Necesario para queries asíncronas y actualizaciones en tiempo real
    location /ws {
        proxy_pass http://superset;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts más largos para WebSockets
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
    
    # ============================================
    # API ENDPOINTS
    # ============================================
    # Endpoints de API con timeouts extendidos
    location /api/ {
        proxy_pass http://superset;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Timeouts extendidos para queries largas
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffers grandes para respuestas de datos
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 32 16k;
        proxy_busy_buffers_size 64k;
    }
    
    # ============================================
    # SUPERSET SQL LAB
    # ============================================
    # Endpoints de SQL Lab con timeouts muy largos
    location /superset/sql_json/ {
        proxy_pass http://superset;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts muy largos para queries complejas
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # Buffers muy grandes para resultados de queries
        proxy_buffering on;
        proxy_buffer_size 32k;
        proxy_buffers 64 32k;
        proxy_busy_buffers_size 128k;
    }
    
    # ============================================
    # MAIN APPLICATION
    # ============================================
    # Todas las demás rutas
    location / {
        proxy_pass http://superset;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Soporte para WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Timeouts estándar
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffers
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 32 16k;
        proxy_busy_buffers_size 64k;
        
        # No cachear páginas dinámicas
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}

# ============================================
# WEBSOCKET CONNECTION UPGRADE MAP
# ============================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
# ============================================
# NGINX CONFIGURATION FOR SUPERSET
# ============================================
# Configuración optimizada para Apache Superset
# Soporta dashboards grandes, queries largas y WebSockets

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # ============================================
    # LOGGING
    # ============================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    
    # ============================================
    # PERFORMANCE
    # ============================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Timeouts
    keepalive_timeout 75s;
    keepalive_requests 100;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    
    # Buffers - Aumentados para Superset
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    client_max_body_size 100M;  # Para uploads de archivos grandes
    large_client_header_buffers 4 16k;
    
    # Output buffers
    output_buffers 32 32k;
    postpone_output 1460;
    
    # ============================================
    # COMPRESSION
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_disable "msie6";
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-font-ttf
        application/x-javascript
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/eot
        font/opentype
        font/otf
        image/bmp
        image/svg+xml
        image/vnd.microsoft.icon
        image/x-icon
        text/cache-manifest
        text/calendar
        text/css
        text/javascript
        text/markdown
        text/plain
        text/xml
        text/x-component
        text/x-cross-domain-policy;
    
    # ============================================
    # SECURITY HEADERS (básicos)
    # ============================================
    # Headers más específicos se configuran en los archivos de servidor
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # ============================================
    # PROXY SETTINGS
    # ============================================
    # Configuración global de proxy
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # Timeouts de proxy - Aumentados para queries largas
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # Buffers de proxy - Aumentados para respuestas grandes
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 32 16k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;
    proxy_max_temp_file_size 1024m;
    
    # ============================================
    # RATE LIMITING (opcional, deshabilitado por defecto)
    # ============================================
    # Descomentar para habilitar rate limiting
    # limit_req_zone $binary_remote_addr zone=superset_limit:10m rate=10r/s;
    # limit_req_status 429;
    
    # ============================================
    # UPSTREAM
    # ============================================
    upstream superset {
        server superset:8088 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # ============================================
    # SERVER CONFIGURATIONS
    # ============================================
    # Carga la configuración del servidor (HTTP o SSL) desde el directorio conf.d
    include /etc/nginx/conf.d/*.conf;
}
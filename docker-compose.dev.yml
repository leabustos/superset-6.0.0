# Docker Compose para desarrollo local con certificados autofirmados
# Uso: docker compose -f docker-compose.dev.yml up -d

services:
  db:
    image: postgres:16
    container_name: superset_db_dev
    restart: always
    env_file: .env
    volumes:
      - superset_db_dev:/var/lib/postgresql/data
      - ./docker/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-superset} -d ${POSTGRES_DB:-superset}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - superset_net

  redis:
    image: redis:7
    container_name: superset_cache_dev
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - superset_redis_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - superset_net

  superset-init:
    build:
      context: .
      dockerfile: superset-config/Dockerfile
    container_name: superset_init_dev
    command: ["/bin/sh", "-c", "superset db upgrade && superset fab create-admin --username $${ADMIN_USERNAME} --firstname $${ADMIN_FIRSTNAME:-Admin} --lastname $${ADMIN_LASTNAME:-User} --email $${ADMIN_EMAIL} --password $${ADMIN_PASSWORD} || true && superset init"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_DIALECT=postgresql
    env_file: .env
    volumes:
      - superset_home_dev:/app/superset_home
      - ./superset-config/superset_config.py:/app/pythonpat./superset-config/superset_config.py:ro
    networks:
      - superset_net

  superset:
    build:
      context: .
      dockerfile: superset-config/Dockerfile
    container_name: superset_app_dev
    restart: always
    environment:
      - DATABASE_DIALECT=postgresql
    env_file: .env
    ports:
      - 8088:8088
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    volumes:
      - superset_home_dev:/app/superset_home
      - ./superset-config/superset_config.py:/app/pythonpat./superset-config/superset_config.py:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - superset_net

  superset-worker:
    build:
      context: .
      dockerfile: superset-config/Dockerfile
    container_name: superset_worker_dev
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    environment:
      - DATABASE_DIALECT=postgresql
    env_file: .env
    volumes:
      - superset_home_dev:/app/superset_home
      - ./superset-config/superset_config.py:/app/pythonpat./superset-config/superset_config.py:ro
    healthcheck:
      test: ["CMD-SHELL", "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - superset_net

  superset-worker-beat:
    build:
      context: .
      dockerfile: superset-config/Dockerfile
    container_name: superset_worker_beat_dev
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      - DATABASE_DIALECT=postgresql
    volumes:
      - superset_home_dev:/app/superset_home
      - ./superset-config/superset_config.py:/app/pythonpat./superset-config/superset_config.py:ro
    healthcheck:
      disable: true
    networks:
      - superset_net

  # Nginx con certificados autofirmados
  nginx-dev:
    image: nginx:latest
    container_name: superset_nginx_dev
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/superset_dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs-dev:/etc/nginx/certs:ro
    networks:
      - superset_net
    depends_on:
      - superset

volumes:
  superset_home_dev:
  superset_db_dev:
  superset_redis_dev:

networks:
  superset_net:
    driver: bridge
